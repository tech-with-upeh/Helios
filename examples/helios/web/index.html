<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title></title>
</head>
  <body>
    <input type="text" id="inputField" placeholder="Type something..." />
      <script>
          window.Helios = {
              ws: null,

              init() {
                  const protocol = location.protocol === "https:" ? "wss" : "ws";
                  this.ws = new WebSocket(`${protocol}://${location.host}/ws`);

                  this.ws.onmessage = (e) => {
                    if (e.data === "r") {
                        location.reload();
                    } else if (e.data === "Error") {
                        // next message will be the actual error
                        this.waitingForError = true;
                        console.log(e.data);
                    } else if (this.waitingForError) {
                        // actual error message received
                        this.waitingForError = false;

                        if (Module && Module._handleRoute) {
                            // allocate string in WASM memory
                            const length = Module.lengthBytesUTF8(e.data) + 1;
                            const buffer = Module._malloc(length);
                            Module.stringToUTF8(e.data, buffer, length);

                            // call the exposed C++ function
                            //Module._js_setTitle(buffer);
                            Module._handleRoute(buffer, true);

                            // free memory
                            Module._free(buffer);
                        } else {
                            console.warn("Module._handleError not found!");
                        }
                    } else {
                        // normal message
                        console.log("[WS]", e.data);
                    }
                    }
                },

              send(msg) {
                  if (this.ws?.readyState === WebSocket.OPEN) {
                      this.ws.send(msg);
                  }
              }
          };

          Helios.init();
          var Module = {
              onRuntimeInitialized: function() {
                  console.log('[HELIOS] WASM Module initialized [HELIOS]');
              },
              print: function(text) {
                  Helios.send(text);
                  console.log('[HELIOS]:', text);
              }
          };

          document.addEventListener('click', function(event) {
              const target = event.target;
              const callbackId = target.getAttribute('data-callback');
              
              if (callbackId && Module && Module._invokeVNodeCallback) {
                  const length = Module.lengthBytesUTF8(callbackId) + 1;
                  const buffer = Module._malloc(length);
                  Module.stringToUTF8(callbackId, buffer, length);
                  
                  Module._invokeVNodeCallback(buffer);
                  Module._free(buffer);
              }
          });
      </script>
      
      <script src="main.js"></script>
  </body>
  </html>
